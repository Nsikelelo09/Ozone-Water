<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            /* Replace 'water-background.jpg' with your actual local image filename */
            background-image: url('water-bg.jpg.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        header {
            background-color: rgba(0, 119, 182, 0.85);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        nav a:hover {
            text-decoration: underline;
            color: #ffdd99;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background-color: rgba(0, 0, 0, 0.4);
            margin: 50px 20px;
            border-radius: 20px;
        }

        .hero h2 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #00a8ff;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #0077b3;
            transform: scale(1.05);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding: 40px 20px;
            margin: 30px 20px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            width: 260px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
            color: #0077b3;
        }

        .card p {
            font-size: 1rem;
            line-height: 1.4;
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.7);
            margin-top: 50px;
            font-size: 0.9rem;
        }
