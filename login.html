<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ozone Amanzi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: url('https://images.pexels.com/photos/1903702/pexels-photo-1903702.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&dpr=2');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        header {
            background-color: rgba(0, 119, 182, 0.85);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        nav a:hover {
            text-decoration: underline;
            color: #ffdd99;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 40px 20px;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 40px 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            color: #0077b3;
            font-size: 2rem;
        }

        .login-card p {
            margin-bottom: 25px;
            color: #555;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00a8ff;
            box-shadow: 0 0 5px rgba(0,168,255,0.5);
        }

        .btn-login {
            width: 100%;
            background-color: #00a8ff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #0077b3;
            transform: scale(1.02);
        }

        .register-link {
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #0077b3;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            margin-top: 50px;
            font-size: 0.9rem;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 20px;
            }
            header {
                flex-direction: column;
                gap: 10px;
            }
            nav a {
                margin: 0 15px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Ozone Amanzi</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="login-container">
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Sign in to order fresh water</p>
        <form action="#" method="post">
            <div class="input-group">
                <label for="email">Email or Phone</label>
                <input type="text" id="email" name="email" required placeholder="e.g., you@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div class="register-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Ozone Amanzi – Pure Water Delivery</p>
</footer>

</body>
</html>
