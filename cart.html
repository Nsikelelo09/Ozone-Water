<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Ozone Amanzi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* NEW PREMIUM WATER BACKGROUND */
body{
    min-height:100vh;
    background: url('https://images.pexels.com/photos/416528/pexels-photo-416528.jpeg') center/cover no-repeat fixed;
    color:#fff;
}

/* DARK BLUE GLASS OVERLAY */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background: linear-gradient(135deg, rgba(0,10,25,0.75), rgba(0,0,0,0.7));
    z-index:-1;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 50px;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    position:sticky;
    top:0;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

header h1{
    color:#00d4ff;
    font-size:22px;
}

nav a{
    color:#fff;
    margin-left:15px;
    text-decoration:none;
    font-weight:500;
    transition:0.3s;
}

nav a:hover{
    color:#00d4ff;
}

/* LAYOUT */
.container{
    display:flex;
    gap:20px;
    padding:40px;
    max-width:1100px;
    margin:auto;
}

/* CART ITEMS */
.cart-items{
    flex:2;
}

.item{
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,0.1);
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.3s;
}

.item:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,0.12);
}

.item-info h3{
    margin-bottom:6px;
}

.item-info p{
    opacity:0.8;
    font-size:14px;
}

/* QTY */
.qty-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.qty-controls button{
    width:28px;
    height:28px;
    border:none;
    background:#00d4ff;
    color:#001018;
    font-weight:bold;
    border-radius:6px;
    cursor:pointer;
}

.qty-controls span{
    min-width:20px;
    text-align:center;
}

/* REMOVE */
.remove{
    background:#ff4d4d;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.remove:hover{
    background:#ff1f1f;
}

/* SUMMARY */
.summary{
    flex:1;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,0.1);
    padding:20px;
    border-radius:16px;
    position:sticky;
    top:90px;
    height:fit-content;
}

.summary h3{
    margin-bottom:15px;
    color:#00d4ff;
}

.total{
    font-size:22px;
    margin-bottom:15px;
    font-weight:700;
}

/* CHECKOUT BUTTON */
.checkout-btn{
    width:100%;
    padding:12px;
    background:#00ff88;
    color:#00150a;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    transition:0.3s;
}

.checkout-btn:hover{
    background:#00cc6a;
    transform:scale(1.03);
}

/* EMPTY CART */
.empty{
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:16px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.1);
}

/* RESPONSIVE */
@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    header{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Ozone Amanzi</h1>
    <nav>
        <a href="product.html">Products</a>
        <a href="index.html">Home</a>
    </nav>
</header>

<div class="container">

    <div class="cart-items" id="cart"></div>

    <div class="summary">
        <h3>Order Summary</h3>
        <div class="total" id="total">Total: R0</div>
        <button class="checkout-btn" onclick="checkout()">
            Proceed to Checkout
        </button>
    </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
    localStorage.setItem("cart", JSON.stringify(cart));
}

function render(){
    let container = document.getElementById("cart");
    container.innerHTML = "";

    let total = 0;

    if(cart.length === 0){
        container.innerHTML = `
        <div class="empty">
            <h2>Your cart is empty 🛒</h2>
            <p>Add fresh water bottles to continue</p>
        </div>`;
        document.getElementById("total").innerText = "Total: R0";
        return;
    }

    cart.forEach((item, index) => {

        let subtotal = item.price * item.quantity;
        total += subtotal;

        container.innerHTML += `
        <div class="item">

            <div class="item-info">
                <h3>${item.name}</h3>
                <p>R${item.price} per bottle</p>

                <div class="qty-controls">
                    <button onclick="decrease(${index})">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="increase(${index})">+</button>
                </div>
            </div>

            <div>
                <p><b>R${subtotal}</b></p>
                <button class="remove" onclick="removeItem(${index})">Remove</button>
            </div>

        </div>`;
    });

    document.getElementById("total").innerText = "Total: R" + total;
}

function increase(i){
    cart[i].quantity++;
    save();
    render();
}

function decrease(i){
    cart[i].quantity--;

    if(cart[i].quantity <= 0){
        cart.splice(i,1);
    }

    save();
    render();
}

function removeItem(i){
    cart.splice(i,1);
    save();
    render();
}

function checkout(){
    window.location.href = "payment.html";
}

render();
</script>

</body>
</html>
