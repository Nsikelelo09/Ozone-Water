href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* MAIN CARD */
.container{
    width:100%;
    max-width:650px;
}

.box{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:32px;
    margin-bottom:8px;
}

.header p{
    opacity:0.85;
    font-size:14px;
}

/* TRUST BADGES */
.badges{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.badge{
    background:rgba(255,255,255,0.15);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
}

/* FORM */
input, textarea{
    width:100%;
    padding:14px;
    margin-top:10px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:14px;
}

/* BUTTONS */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.primary{
    background:#00d4ff;
    color:black;
}

.primary:hover{
    background:#00aacc;
    transform:scale(1.02);
}

.secondary{
    background:rgba(255,255,255,0.2);
    color:white;
    margin-bottom:10px;
}

.secondary:hover{
    background:rgba(255,255,255,0.3);
}

/* RESULT CARD */
#result{
    margin-top:25px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    display:none;
    animation:fadeIn .5s ease;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

#result h3{
    margin-bottom:15px;
    color:#7dd3fc;
}

#result p{
    margin:8px 0;
    font-size:15px;
}

#result hr{
    border:none;
    height:1px;
    background:rgba(255,255,255,.2);
    margin:15px 0;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* STEP LABEL */
.step{
    font-size:12px;
    opacity:0.7;
    margin-bottom:10px;
}



</style>

</head>

<body>

<div class="container">

<div class="box">

    <div class="header">
        <h1>🚚 Secure Delivery Checkout</h1>
        <p>Enter your details to calculate your delivery fee</p>
    </div>

    <div class="badges">
        <div class="badge">🔒 Secure System</div>
        <div class="badge">⚡ Fast Delivery</div>
        <div class="badge">💧 Trusted Water Service</div>
    </div>

    <form onsubmit="calculateDelivery(event)">

        <div class="step">Step 1 — Personal Details</div>

        <input id="name" type="text" placeholder="Full Name" required>
        <input id="phone" type="text" placeholder="Phone Number" required>

       <div class="step">Step 2 — Delivery Address</div>

<textarea id="address"
placeholder="House number, street, suburb, city"
required></textarea>

<button type="button" class="secondary" onclick="openMap()">
📍 Select Delivery Location On Map
</button>

<div id="mapContainer" style="display:none;margin-top:15px;">
    <div id="map" style="height:400px;border-radius:15px;"></div>

    <p id="selectedAddress"
       style="margin-top:10px;font-size:14px;">
       No location selected
    </p>
</div>

<button class="primary" type="submit">
    Calculate Delivery Fee
</button>

    </form>

    <div id="result"></div>

</div>

</div>

<script>

// store location
// SHOP LOCATION (YOUR BUSINESS)
const shopLat = -29.8589;
const shopLng = 31.0220;

// CUSTOMER LOCATION
let userLat = null;
let userLng = null;

// MAP VARIABLES
let map;
let marker;
function openMap(){

    document.getElementById("mapContainer").style.display = "block";

    if(map){
        setTimeout(() => map.invalidateSize(), 100);
        return;
    }

    map = L.map('map').setView([shopLat, shopLng], 12);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap contributors'
        }
    ).addTo(map);

    L.marker([shopLat, shopLng])
        .addTo(map)
        .bindPopup("Shop Location")
        .openPopup();

    setTimeout(() => {
        map.invalidateSize();
    }, 100);

    map.on('click', async function(e){

        userLat = e.latlng.lat;
        userLng = e.latlng.lng;

        if(marker){
            map.removeLayer(marker);
        }

        marker = L.marker([userLat, userLng])
            .addTo(map)
            .bindPopup("Delivery Address")
            .openPopup();

        try{

            const url =
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`;

            const res = await fetch(url);
            const data = await res.json();

            const address =
            data.display_name || "Address not found";

            document.getElementById("address").value = address;

            document.getElementById("selectedAddress").innerHTML =
            "✅ Selected Address:<br>" + address;

        }catch(error){

            console.error(error);

            document.getElementById("selectedAddress").innerHTML =
            "Location selected";
        }
    });
}
function getLocation(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition((pos) => {

            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;

        console.log("Shop:", shopLat, shopLng);
console.log("User:", userLat, userLng);

alert(
`Shop:
${shopLat}, ${shopLng}

User:
${userLat}, ${userLng}`
);

        }, () => {
            alert("Please allow location access");
        });

    }
}

async function geocodeAddress(address){

    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;

    const res = await fetch(url);
    const data = await res.json();

    if(data.length === 0){
        alert("Address not found. Please be more specific.");
        return null;
    }

    return {
        lat: parseFloat(data[0].lat),
        lng: parseFloat(data[0].lon)
    };
}

// distance calculation
function calculateDistance(lat1, lon1, lat2, lon2){

    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}
async function calculateDelivery(e){

    e.preventDefault();

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;

    let coords;

    // 1. USE GPS IF AVAILABLE
    if(userLat !== null && userLng !== null){
        coords = {
            lat: userLat,
            lng: userLng
        };
    }

    // 2. OTHERWISE USE ADDRESS (VERY IMPORTANT)
    else{
        coords = await geocodeAddress(address);

        if(!coords){
            alert("Could not find location from address");
            return;
        }
    }

    let distance = calculateDistance(
        shopLat,
        shopLng,
        coords.lat,
        coords.lng
    );

    // DELIVERY FEE (500m = R3)
    const meters = distance * 1000;
    const deliveryFee = Math.ceil(meters / 500) * 3;

    // CART
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let productsTotal = 0;

    cart.forEach(item => {
        productsTotal += item.price * item.quantity;
    });

    const grandTotal = productsTotal + deliveryFee;

    const result = document.getElementById("result");
    result.style.display = "block";

    result.innerHTML = `
    <h3>📦 Order Summary</h3>

    <p><b>Name:</b> ${name}</p>
    <p><b>Phone:</b> ${phone}</p>
    <p><b>Address:</b> ${address}</p>

    <hr>

    <p><b>Products Total:</b> R${productsTotal.toFixed(2)}</p>
    <p><b>Distance:</b> ${distance.toFixed(2)} km</p>
    <p><b>Delivery Fee:</b> R${deliveryFee.toFixed(2)}</p>

    <hr>

    <h2 style="color:#00d4ff">
        Total: R${grandTotal.toFixed(2)}
    </h2>

    <button
        onclick="window.location.href='Payment.html'"
        style="
            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            border-radius:30px;
            background:#00d4ff;
            color:black;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        ">
        Proceed To Payment →
    </button>
    `;

    localStorage.setItem("deliveryOrder", JSON.stringify({
        name,
        phone,
        address,
        distance,
        deliveryFee,
        productsTotal,
        grandTotal
    }));
}

    function continueToPayment(){

    window.location.href = "payment.html";

}

window.onload = function(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition((pos)=>{

            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;

            console.log("Customer location detected");

        });

    }

}
</script>

</body>
