<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<meta charset="UTF-8">
<title>Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<script src="app.js"></script>
<body>
    <body>

<header class="brand-header">
    <div class="brand-logo">💧</div>
    <div class="brand-text">
        <h1>Ozone Amanzi</h1>
        <span>Pure Water Delivery</span>
    </div>
</header>

<div class="form-container">
<form class="form-box" onsubmit="signup(event)">

<h1>Sign Up</h1>
<input id="name" placeholder="First Name" required>

<input id="surname" placeholder="Surname" required>

<input id="email" type="email" placeholder="Email Address" required>

<input id="confirmEmail" type="email" placeholder="Confirm Email Address" required>

<input id="password" type="password"
placeholder="Password (8+ characters, at least 1 letter)"
required>

<button>Sign Up</button>

</form>
</div>

<script>
function signup(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const surname = document.getElementById("surname").value.trim();
    const email = document.getElementById("email").value.trim();
    const confirmEmail = document.getElementById("confirmEmail").value.trim();
    const password = document.getElementById("password").value;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email)){
        showToast("Please enter a valid email address.", "error");
        return;
    }

    if(email !== confirmEmail){
        showToast("Email addresses do not match.", "error");
        return;
    }

    const passwordPattern = /^(?=.*[A-Za-z]).{8,}$/;

    if(!passwordPattern.test(password)){
        showToast(
            "Password must be at least 8 characters and contain at least 1 letter.",
            "error"
        );
        return;
    }

    const user = {
        name,
        surname,
        email,
        password
    };

    localStorage.setItem("user", JSON.stringify(user));
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("currentUser", email);

    showToast("Account created successfully!", "success");

    setTimeout(() => {
        const redirect = localStorage.getItem("redirectAfterLogin");

        if(redirect){
            localStorage.removeItem("redirectAfterLogin");
            window.location.href = redirect;
        }else{
            window.location.href = "payment.html";
        }
    }, 1200);
}

/* toast system (same style as login page) */
function showToast(message, type = "success"){
    const toast = document.getElementById("toast");

    if(!toast) return;

    toast.innerText = message;
    toast.className = "";

    toast.classList.add("show");
    toast.classList.add(type);

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}
</script>

</body>
</html>
