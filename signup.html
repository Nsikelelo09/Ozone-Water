<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<style>
  * {
    box-sizing: border-box;
  }

  .form-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    font-family: system-ui, 'Segoe UI', sans-serif;
  }

  .form-box {
    background: white;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;   /* vertical stacking */
    gap: 1rem;
  }

  .form-box h1 {
    margin: 0 0 0.5rem 0;
    font-size: 1.8rem;
    text-align: center;
  }

  .form-box input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #ccc;
    border-radius: 0.5rem;
    font-size: 1rem;
    transition: 0.2s;
  }

  .form-box input:focus {
    outline: none;
    border-color: #2c7da0;
    box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
  }

  .form-box button {
    background: #2c7da0;
    color: white;
    border: none;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
  }

  .form-box button:hover:not(:disabled) {
    background: #1f5e7a;
  }

  .form-box button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }

  #emailError {
    margin-top: -0.5rem;
    font-size: 0.85rem;
  }

  /* toast styling (minimal) */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 12px 20px;
    border-radius: 40px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
  }
  #toast.success {
    background: #2e7d32;
  }
  #toast.error {
    background: #c62828;
  }
</style>
</head>
<body>

<div id="toast"></div>

<div class="form-container">
  <form class="form-box" onsubmit="signup(event)">
    <h1>Sign Up</h1>
    <input id="name" placeholder="Full Name" required>
    <input id="surname" placeholder="Surname" required>
    <input id="email" placeholder="Email" required>
    <input id="confirmEmail" placeholder="Confirm Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <small id="emailError" style="color: red; display: none;"></small>
    <button type="submit">Create Account</button>
  </form>
</div>

<script>
async function signup(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const surname = document.getElementById('surname').value.trim();
    const email = document.getElementById('email').value.trim();
    const confirmEmail = document.getElementById('confirmEmail').value.trim();
    const password = document.getElementById('password').value;

    if (email !== confirmEmail) {
        showToast("Emails do not match", "error");
        return;
    }

    if (!isValidEmailFormat(email)) {
        showToast("Invalid email format", "error");
        return;
    }

    if (!isStrongPassword(password)) {
        showToast("Password must be 8+ chars with at least 2 special characters (!@#$%)", "error");
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, surname, email, password })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error);

        showToast("Verification email sent! Please check your inbox (and spam folder).", "success");
        document.querySelector('button').disabled = true;
        document.querySelector('button').innerText = "Check your email to verify...";

        window.addEventListener('message', (event) => {
            if (event.data === 'verificationComplete') {
                window.location.href = "login.html";
            }
        });
    } catch (err) {
        showToast(err.message || "Signup failed", "error");
    }
}

function isValidEmailFormat(email) {
    return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email);
}

function isStrongPassword(pwd) {
    const specialChars = /[!@#$%]/g;
    return pwd.length >= 8 && (pwd.match(specialChars) || []).length >= 2;
}

function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    if (!toast) return;
    toast.innerText = message;
    toast.className = "";
    toast.classList.add("show");
    toast.classList.add(type);
    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}
</script>

</body>
</html>
