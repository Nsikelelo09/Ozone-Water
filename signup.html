<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Amanzi</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* 🌟 Smooth popup */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff9800;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="form-container">

    <form class="form-box" onsubmit="signupUser(event)">
        <h2>Create Account</h2>

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="email" id="email" placeholder="Email" required>

        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Sign Up</button>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </form>

</div>

<!-- 🌟 Toast -->
<div id="toast" class="toast"></div>

<script>
function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

function signupUser(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;

    // 🔐 Demo existing account
    const existingEmail = "test@ozone.com";

    if (email === existingEmail) {
        showToast("You already have an account. You should login.");
        
        // optional redirect after delay
        setTimeout(() => {
            window.location.href = "login.html";
        }, 3000);

    } else {
        // new user → go to products page
        window.location.href = "products.html";
    }
}
</script>

</body>
</html>
