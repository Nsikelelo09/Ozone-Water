<!DOCTYPE html>
<html>
<body>

<h2>Firebase Test</h2>
<button onclick="test()">Send Test Data</button>

<script type="module">
import { db } from "./firebase.js";
import { ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

window.test = function(){

    set(ref(db, "test/message"), {
        text: "Hello Firebase 🚀",
        time: Date.now()
    });

    alert("Data sent to Firebase!");
}
</script>

</body>
</html>
